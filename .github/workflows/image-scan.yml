name: Image scan

# Weekly scan of the latest released image with Trivy: new vulnerabilities in
# the Debian packages or the Go binary show up after a release, too. All
# findings go to Security -> Code scanning; the run fails when a HIGH or
# CRITICAL vulnerability has a fix available (time for a rebuild or release).
# Actions are pinned to full commit SHAs.
on:
  schedule:
    - cron: "41 5 * * 1" # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Registries accept lowercase repository names only; the GitHub repository name may have capitals.
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

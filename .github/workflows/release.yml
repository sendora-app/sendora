name: Release image

# Publishes the container image for amd64 and arm64 to the GitHub Container
# Registry when a version tag (v1.2.3) is pushed, after the full CI (ci.yml)
# passed for that tag. Each platform is built natively on its own runner and
# pushed by digest; the merge job then creates the multi-arch tags, the build
# provenance and SBOM attestations and a keyless cosign signature.
# Uses the workflow's own GITHUB_TOKEN; no personal registry credentials.
#
# A manual run builds a version whose tag push did not produce an image. Start
# it from the version tag (Run workflow -> Use workflow from -> v1.2.3); it
# refuses to overwrite a version that is already published.
#
# Actions are pinned to full commit SHAs (version in the comment).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 0.2.0"
        required: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Nothing is built or published until a maintainer approves the run in the
    # 'release' environment (repository settings: required reviewer, v* tags only).
    environment: release
    permissions:
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      # Registries accept lowercase repository names only; the GitHub repository name may have capitals.
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$v' is not a version of the form 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # A manual run must also be started from the tag ("Use workflow from:
          # v1.2.3"), so the signature names the tag like a tag push does.
          if [ "$GITHUB_REF" != "refs/tags/v$v" ]; then
            echo "::error::start this workflow from the tag v$v, not from $GITHUB_REF"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/v$v" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION already exists; a published version is never rebuilt."
            exit 1
          fi
          docker logout ghcr.io
          # Only "not found" means free; any other error must not be taken for it.
          if ! printf '%s' "$out" | grep -qi 'not found'; then
            echo "::error::could not check $IMAGE:$VERSION: $out"
            exit 1
          fi

  # The release is gated on the complete test suite for exactly this tag.
  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  build:
    needs: [prepare, ci]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Registries accept lowercase repository names only; the GitHub repository name may have capitals.
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Platform name
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - name: Revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
          # GitHub's license detection would report "AGPL-3.0" (without "or-later").
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ steps.revision.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM are GitHub attestations of the final image
          # (merge job), not BuildKit attestation manifests.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Registries accept lowercase repository names only; the GitHub repository name may have capitals.
      - name: Image name in lowercase
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            # Only a new release tag moves "latest"; a manual run (possibly for an
            # older version) and a pre-release (1.2.3-rc.1) must not.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(needs.prepare.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Create the multi-arch manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 platform digests"; ls; exit 1; }
          args=()
          while IFS= read -r t; do args+=(--tag "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE:$VERSION"; exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sendora.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sendora.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate names this workflow and the tag it ran for.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

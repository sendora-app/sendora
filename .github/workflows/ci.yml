name: CI

# Actions are pinned to full commit SHAs (version in the comment); Dependabot
# keeps them current. release.yml calls this workflow so that no image is
# published from a commit whose tests fail.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the ref of the triggering event)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Known high/critical vulnerabilities in the dependencies shipped in the
      # browser bundle fail the build (build-only dev dependencies excluded).
      - name: npm audit
        run: npm --prefix web audit --omit=dev --audit-level=high
      - run: node --test web/src/*.test.mjs
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # The sqlcipher stage of the Dockerfile builds the exact engine (4.20.0)
      # with a verified checksum; the tests run inside it.
      - name: Build the SQLCipher/Go toolchain image
        run: docker build --target sqlcipher -t sendora-sqlcipher .
      # Known vulnerabilities in reachable code of the Go dependencies and the
      # standard library fail the build. Runs in the toolchain image because
      # the packages need the SQLCipher headers (cgo).
      - name: govulncheck
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            -e CGO_ENABLED=1 -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod -e GOFLAGS=-buildvcs=false \
            sendora-sqlcipher go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: vet and test
        run: |
          # Not as root: some tests rely on file permissions being enforced.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            -e CGO_ENABLED=1 -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod -e GOFLAGS=-buildvcs=false \
            sendora-sqlcipher sh -c 'go vet ./... && go test -race -count=1 -timeout 40m ./...'

  # Object storage backends and the end-to-end storage flow against real
  # emulators: MinIO (S3), Azurite (Azure Blob) and fake-gcs-server (GCS).
  # The tests skip themselves without the SENDORA_TEST_* variables, so the go
  # job above runs them against in-memory backends only. The emulators are
  # started with docker run (pinned by digest) because Azurite and
  # fake-gcs-server need command-line flags that service containers cannot
  # pass; the test container shares the host network to reach them.
  storage:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Start the storage emulators
        run: |
          set -eu
          # MinIO no longer publishes images on Docker Hub; Bitnami's legacy MinIO build.
          docker run -d --name minio -p 19000:9000 -e MINIO_ROOT_USER=sendora -e MINIO_ROOT_PASSWORD=sendora-ci-secret \
            bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          docker run -d --name azurite -p 20000:10000 \
            mcr.microsoft.com/azure-storage/azurite@sha256:c26024d62bf4a5b88a40968afd217234c00e1fc9a4790dc6105d1ca7979f6eec \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          docker run -d --name fakegcs -p 24443:4443 \
            fsouza/fake-gcs-server@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -scheme http -port 4443 -external-url http://127.0.0.1:24443
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null 2>&1 \
              && curl -sS -o /dev/null http://127.0.0.1:20000/ \
              && curl -fsS http://127.0.0.1:24443/storage/v1/b >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs minio; docker logs azurite; docker logs fakegcs
          exit 1
      - name: Build the SQLCipher/Go toolchain image
        run: docker build --target sqlcipher -t sendora-sqlcipher .
      - name: Storage tests against the emulators
        run: |
          # Azurite's well-known development account key (public, not a secret).
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            -e CGO_ENABLED=1 -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod -e GOFLAGS=-buildvcs=false \
            -e SENDORA_TEST_S3_ENDPOINT=http://127.0.0.1:19000 -e SENDORA_TEST_S3_ACCESS_KEY=sendora -e SENDORA_TEST_S3_SECRET_KEY=sendora-ci-secret \
            -e SENDORA_TEST_AZURE_ACCOUNT=devstoreaccount1 -e SENDORA_TEST_AZURE_ENDPOINT=http://127.0.0.1:20000/devstoreaccount1 \
            -e SENDORA_TEST_AZURE_KEY='Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==' \
            -e SENDORA_TEST_GCS_ENDPOINT=http://127.0.0.1:24443 \
            sendora-sqlcipher go test -race -count=1 -timeout 20m -v \
              -run 'Emulator|AzureBlob|ObjectStorage|StorageMigrate|Conformance' \
              ./internal/storage/... ./internal/app/ ./internal/dbcli/
      - name: Emulator logs
        if: failure()
        run: docker logs minio; docker logs azurite; docker logs fakegcs

  image:
    needs:
      - web
      - go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: docker build -t sendora:ci .
      # The image must start, answer its own health check and use SQLCipher 4.20.0.
      - name: Smoke test
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/smoke"
          head -c 32 /dev/urandom > "$RUNNER_TEMP/smoke/database.key"
          sudo chown 10001:10001 "$RUNNER_TEMP/smoke/database.key"
          docker run -d --name sendora-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/smoke/database.key:/run/secrets/database.key:ro" \
            -e SENDORA_DB_KEY_FILE=/run/secrets/database.key -e SENDORA_DB_INITIALIZE=true \
            --mount type=volume,dst=/data sendora:ci
          for _ in $(seq 1 60); do
            if docker exec sendora-smoke /sendora healthcheck; then break; fi
            sleep 2
          done
          docker exec sendora-smoke /sendora healthcheck
          docker logs sendora-smoke 2>&1 | grep -q 'sqlcipher=4\.20\.0'
      - name: Container logs
        if: always()
        run: docker logs sendora-smoke 2>&1 | grep -v 'setup code' || true

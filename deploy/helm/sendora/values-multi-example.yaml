# Multi-tenant (SQLite) Sendora: <slug>.sendora.example.com and admin.sendora.example.com.
flavour: multi
image:
  repository: registry.example.com/sendora
  tag: "0.3.0"
baseDomain: sendora.example.com
trustedProxies: 10.0.0.0/8
masterKey:
  existingSecret: sendora-db-key
database:
  initialize: true
persistence:
  size: 100Gi                                # platform.db + tenants/<id>/
config:
  SENDORA_TENANT_IDLE_MINUTES: 15
  SENDORA_MAX_OPEN_TENANTS: 50
app:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi
tmp:
  sizeLimit: 4Gi
ingress:
  enabled: true
  className: nginx
  tls:
    secretName: sendora-wildcard-tls  # wildcard certificate: DNS-01 (operator)
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if eq .Values.flavour "cluster" }}
{{- $port := int .Values.cluster.keyEndpoint.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sendora.webName" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sendora.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{ toJson $np.ingress.namespaceSelector }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- with $np.extraIngress }}{{ toYaml . | nindent 4 }}{{ end }}
  egress:
    {{- include "sendora.dnsPeer" . | nindent 4 }}
    # PostgreSQL through the pooler only.
    - to:
        - {{- include "sendora.npPostgres" . | nindent 10 }}
      ports:
        - { protocol: TCP, port: {{ $np.postgres.port }} }
    # Key endpoint of the controllers.
    - to:
        - podSelector:
            matchLabels:
              {{- include "sendora.selectorLabels" (dict "ctx" . "component" "controller") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $port }} }
    {{- include "sendora.npInternet" . | nindent 4 }}
    {{- with $np.extraEgress }}{{ toYaml . | nindent 4 }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sendora.controllerName" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sendora.selectorLabels" (dict "ctx" . "component" "controller") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only web pods reach the key endpoint.
    - from:
        - podSelector:
            matchLabels:
              {{- include "sendora.selectorLabels" (dict "ctx" . "component" "web") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $port }} }
    {{- with $np.extraIngress }}{{ toYaml . | nindent 4 }}{{ end }}
  egress:
    {{- include "sendora.dnsPeer" . | nindent 4 }}
    # PostgreSQL: the pooler and the direct read-write service (5432 by default).
    - to:
        - {{- include "sendora.npPostgres" . | nindent 10 }}
      ports:
        - { protocol: TCP, port: {{ $np.postgres.port }} }
    # Kubernetes API: Lease and TokenReview.
    - to:
        {{- if $np.kubeApi.cidrs }}
        {{- range $np.kubeApi.cidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- else }}
        - ipBlock: { cidr: 0.0.0.0/0 }
        {{- end }}
      ports:
        {{- range $np.kubeApi.ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- include "sendora.npInternet" . | nindent 4 }}
    {{- with $np.extraEgress }}{{ toYaml . | nindent 4 }}{{ end }}
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sendora.fullname" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sendora.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {{ toJson $np.ingress.namespaceSelector }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- with $np.extraIngress }}{{ toYaml . | nindent 4 }}{{ end }}
  egress:
    {{- include "sendora.dnsPeer" . | nindent 4 }}
    {{- include "sendora.npInternet" . | nindent 4 }}
    {{- with $np.extraEgress }}{{ toYaml . | nindent 4 }}{{ end }}
{{- end }}
{{- end }}

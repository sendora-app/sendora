{{- if eq .Values.flavour "cluster" }}
{{- $sa := include "sendora.controllerServiceAccount" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sendora.controllerName" . }}-lease
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sendora.controllerName" . }}-lease
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "sendora.controllerName" . }}-lease }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
# TokenReview is cluster-scoped: it lets the controller verify the tokens web pods present to the key endpoint.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sendora.controllerName" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sendora.controllerName" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "sendora.controllerName" . }}-{{ .Release.Namespace }}-tokenreview }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
{{- end }}

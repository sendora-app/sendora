{{- if .Values.serviceAccount.create }}
{{- if eq .Values.flavour "cluster" }}
{{- if not .Values.serviceAccount.web.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sendora.webName" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# No token is mounted automatically: web pods only get the projected token for the key endpoint.
automountServiceAccountToken: false
{{- end }}
{{- if not .Values.serviceAccount.controller.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sendora.controllerName" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- else if not .Values.serviceAccount.app.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sendora.fullname" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "app") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

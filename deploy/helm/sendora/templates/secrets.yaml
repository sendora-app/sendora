{{- /* Chart-created Secrets (opt-in). See the warnings in values.yaml. */ -}}
{{- if and .Values.masterKey.generate (not .Values.masterKey.existingSecret) }}
{{- $name := include "sendora.keySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* The generated key is version 1 (master-1 in directory mode). Whatever an operator added to the kept
Secret later (master-2, ...) is merged back, never regenerated or overwritten. */ -}}
{{- $dir := include "sendora.keyDirMode" . }}
{{- $kname := .Values.masterKey.secretKey }}
{{- if and $dir (not (regexMatch "^master-[0-9]+$" $kname)) }}{{ $kname = "master-1" }}{{ end }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{ $data = deepCopy $existing.data }}{{ end }}
{{- if not (hasKey $data $kname) }}{{ $_ := set $data $kname (randAscii 32 | b64enc) }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "key") | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it is the key to all data.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
{{- if not .Values.setupCode.existingSecret }}
{{- if or .Values.setupCode.value .Values.setupCode.generate }}
{{- $name := include "sendora.setupSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $val := ternary (.Values.setupCode.value | b64enc) (randAlphaNum 24 | upper | b64enc) (ne .Values.setupCode.value "") }}
{{- if and (not .Values.setupCode.value) $existing $existing.data }}{{ $val = index $existing.data .Values.setupCode.secretKey | default $val }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "setup") | nindent 4 }}
type: Opaque
data:
  {{ .Values.setupCode.secretKey }}: {{ $val }}
{{- end }}
{{- end }}

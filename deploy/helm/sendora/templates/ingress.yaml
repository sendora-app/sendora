{{- if .Values.ingress.enabled }}
{{- $hosts := include "sendora.ingressHosts" . | fromYamlArray }}
{{- $svc := ternary (include "sendora.webName" .) (include "sendora.fullname" .) (eq .Values.flavour "cluster") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sendora.fullname" . }}
  labels:
    {{- include "sendora.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
    {{- end }}
{{- end }}
